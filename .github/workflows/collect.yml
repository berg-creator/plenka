name: Сбор новинок

# Агент слежки: обходит iTunes, Deezer, YouTube и RSS изданий,
# складывает находки в data/inbox.jsonl.
on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов; минута 17, чтобы не попадать в пик нагрузки GitHub
  workflow_dispatch:          # и кнопка ручного запуска в интерфейсе

# Два одновременных сбора подрались бы при коммите состояния.
concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # нужно, чтобы бот мог коммитить обновлённое состояние
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Собрать новинки
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python -m src.collect

      # База артистов пополняется сама: раз в сутки — те, кого назвала пресса
      # сцены (src/newcomers.py). Их релизы ищет уже следующий сбор, а сбой
      # здесь не срывает сохранение находок.
      - name: Пополнить базу артистов
        continue-on-error: true
        run: python -m src.newcomers

      # Пост о свежем релизе пишет тот же сбор, что его нашёл: от выхода релиза
      # до поста не больше суток (решение владельца от 11.09.2026), а следующий
      # сбор — через шесть часов. Сбой генератора не срывает сохранение находок.
      - name: Написать посты о свежих релизах
        continue-on-error: true
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          LLM_FALLBACK: ${{ vars.LLM_FALLBACK || 'gigachat' }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-Pro' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.compose --fresh

      # Полный трек просим сразу: пост ждёт его два часа, потом уходит с отрывком.
      - name: Запросить полные треки
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python -m src.compose --ask-tracks

      # Слежение — вещь неспешная: человек подписался и забыл, а весть о релизе
      # уместна тогда, когда релиз нашёлся. Поэтому рассылка идёт сразу после
      # сбора, а не крутится в дежурстве.
      - name: Забрать списки слежения
        env:
          STATE_REPO: ${{ secrets.STATE_REPO }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          if [ -z "$STATE_REPO" ] || [ -z "$STATE_TOKEN" ]; then
            echo "Приватное хранилище не настроено — рассылать некому."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${STATE_TOKEN}@github.com/${STATE_REPO}.git" private-state
          cd private-state
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          echo "STATE_DIR=${GITHUB_WORKSPACE}/private-state" >> "$GITHUB_ENV"

      - name: Разослать вести о релизах
        if: env.STATE_DIR != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m src.service --notify

      # Сбор идёт каждые шесть часов, а концерты объявляют за месяцы — проход
      # раз в день, дату последнего сам помнит в списке слежения (notify_concerts).
      - name: Разослать вести о концертах
        if: env.STATE_DIR != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m src.service --concerts

      - name: Сохранить списки слежения
        if: env.STATE_DIR != ''
        run: |
          cd private-state
          git add -A
          git diff --cached --quiet || git commit -m "слежение: отправленное отмечено"
          # Бот пишет сюда же посреди дежурства (подписки, города) — подтягиваем его коммиты.
          git pull --rebase --autostash
          git push

      - name: Сохранить состояние
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ content/
          git diff --cached --quiet || git commit -m "сбор: новые находки и посты о свежих релизах"
          # Между checkout и push мог пройти другой воркфлоу — подтягиваем его коммиты.
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
