name: Годовщины

# Раз в сутки проверяет, не выпадает ли на сегодня памятная дата.
# Такие посты нельзя готовить заранее пачкой — они привязаны ко дню.
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Проверить даты
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.calendar_check

      - name: Сохранить состояние
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "годовщина: подготовлен пост"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
