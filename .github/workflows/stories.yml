name: Истории

# История живёт ровно сутки, поэтому выходит раз в день — чаще смысла нет,
# реже означает пустое место вверху ленты сообщества.
#   07:30 UTC = 10:30 МСК — после утреннего поста, на дневном подъёме охвата.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Только нарисовать карточку, не публикуя"
        type: boolean
        default: false

# Пишет data/stories.json, поэтому делит очередь на запись с остальными.
concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Карточки верстались под Arial. Liberation Sans совпадает с ним
      # по метрикам и знает кириллицу — без него Pillow рисует запасным
      # шрифтом, и текст на историях разъезжается.
      - name: Поставить шрифт
        run: sudo apt-get install -y --no-install-recommends fonts-liberation

      - name: Опубликовать историю
        env:
          # Без ключа шаг не падает, а молча пропускается — как кросспостинг.
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python -m src.stories ${{ inputs.preview && '--preview' || '--publish' }}

      - name: Сохранить состояние
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "истории: карточка опубликована"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
