name: Разовая проверка Яндекс Музыки

# Задача 50а в NEXT.md: отвечает ли api.music.yandex.net без ключа с адресов
# GitHub Actions. Разовый — после проверки файл удаляется.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Запросы без ключа
        shell: python
        run: |
          import json, time, urllib.request
          API = "https://api.music.yandex.net/"
          for path in ["search?type=artist&page=0&text=MAYOT", "artists/6312364/brief-info",
                       "users/music-blog/likes/tracks", "users/music-blog/playlists/3",
                       "tracks?track-ids=20935722"]:
              try:
                  with urllib.request.urlopen(API + path, timeout=30) as r:
                      body = json.load(r)
                  result = body.get("result")
                  if isinstance(result, dict) and "library" in result:
                      short = f"лайков {len(result['library'].get('tracks', []))}"
                  elif isinstance(result, dict):
                      short = f"поля {sorted(result)[:6]}"
                  else:
                      short = f"{type(result).__name__} {str(result)[:80]}"
                  print(f"OK  {path} → {short} {body.get('error', '')}")
              except Exception as exc:
                  print(f"ОТКАЗ {path} → {exc}")
          # Частые запросы: режет ли Яндекс серию с одного адреса.
          ok = 0
          for _ in range(20):
              try:
                  with urllib.request.urlopen(API + "artists/41191/brief-info", timeout=30) as r:
                      ok += "result" in json.load(r)
              except Exception:
                  pass
          print(f"серия из 20 brief-info подряд: ответили {ok}")
