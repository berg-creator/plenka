name: Бот

# Единственный опросчик бота: забирает нажатия кнопок под превью постов
# и запросы к сервису разборов. У getUpdates общий offset, поэтому вторым
# workflow это делать нельзя — события будут теряться.
#
# Режим — дежурство: запуск держит соединение с Telegram открытым почти шесть
# часов, поэтому бот отвечает за секунды. Расписанию тут доверять нельзя:
# сначала стоял крон `*/5` и не соблюдался вовсе, потом часовые смены — и между
# ними GitHub пропускал запуски, оставляя дыры по полтора часа. Лечится не
# частотой крона, а длиной смены. Всё это возможно только потому, что
# репозиторий открытый: минуты Actions для публичных репозиториев не считаются.
on:
  schedule:
    # Крон срабатывает каждый час, но смена длится почти шесть — и это не
    # избыточность, а способ пережить пропуски. GitHub регулярно не выполняет
    # запуски по расписанию: на часовых сменах из-за этого получались дыры
    # по полтора часа, когда бот просто не отвечал.
    #
    # Работает это так: пока смена идёт, каждый следующий крон встаёт в очередь
    # группы, а лишние ожидающие GitHub отбрасывает сам — в очереди всегда
    # не больше одного. Как только смена закончится, ожидающий стартует сразу.
    # Чтобы бот замолчал, GitHub должен пропустить все шесть запусков подряд.
    #
    # Минута 34, а не 0: начало часа — пик нагрузки GitHub, и запуски оттуда
    # придерживают первыми (тот же приём, что в collect.yml). Покрытие держит
    # длина смены, но пропускать реже — бесплатно.
    - cron: "34 * * * *"
  # Смена держит в памяти код, с которым стартовала, а длится шесть часов:
  # правка бота доходила бы до владельца только со следующей сменой. Пуш кода
  # ставит свежую смену в очередь, а идущая, подтянув его, уступает ей место
  # (src/moderate.py, code_changed). Пути те же, что в CODE: уступить без
  # ожидающей смены значило бы оставить бота без дежурного.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/moderate.yml"
  workflow_dispatch:

# Своя группа, не общая state-write: смена занимает почти шесть часов,
# и публикация постов не должна стоять в очереди за ней.
concurrency:
  group: bot-serve
  cancel-in-progress: false

jobs:
  serve:
    # Образ закреплён: СВЕДЕНИЕ настроено и проверено на ffmpeg 6.1 из Ubuntu 24.04,
    # а с 19.10.2026 ubuntu-latest — это Ubuntu 26, где ни версия ffmpeg,
    # ни пакет x42-plugins (автотюн) не проверены. Молчаливо отвалившийся
    # автотюн хуже открытой поломки: трек выйдет мимо нот.
    runs-on: ubuntu-24.04
    # Предел GitHub для одной задачи — шесть часов.
    timeout-minutes: 360
    permissions:
      contents: write
      # Последний дубль фразы ролика запускает сборку в reels.yml (src/reels.py),
      # а смена по часам — срочные новости в urgent.yml (src/urgent.py, shift):
      # workflow_dispatch — единственное, что GITHUB_TOKEN запускать разрешено.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ffmpeg перезаливает присланный владельцем полный трек плеером
      # (src/moderate.py) и сводит вокал с битом (src/skleyka.py), а в образе
      # ubuntu-latest его нет. x42-plugins — автотюн стиля «мелодично»: ffmpeg из apt
      # собран с lv2, плагин fat1 — отдельным пакетом, плюс 5 секунд. Не встал —
      # смена всё равно идёт: кнопки и разборы работают, а на трек бот честно
      # ответит, что принять его не может.
      #
      # Пакеты лежат в запасе (actions/cache): обычно установка — полминуты, но в 2 стыках смен
      # из 49 зеркало отдавало 100 КБ/с, шаг шёл 12 минут, и бот всё это время молчал.
      # Сперва — без сети вовсе, из запаса и списков образа; не сошлись версии — обычным путём,
      # и качается только то, чего в запасе нет. Ключ — версия образа: с новым образом запас
      # берётся прежний (restore-keys) и после установки откладывается свежий.
      - name: Узнать версию образа
        id: image
        run: echo "version=${ImageVersion:-none}" >> "$GITHUB_OUTPUT"

      - name: Достать запас пакетов
        id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/debs/*.deb
          key: debs-${{ steps.image.outputs.version }}
          restore-keys: debs-

      - name: Поставить ffmpeg
        continue-on-error: true
        run: |
          mkdir -p ~/debs/partial
          install="sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives=$HOME/debs"
          $install --no-download ffmpeg x42-plugins && exit 0
          sudo apt-get update -qq
          $install ffmpeg x42-plugins

      # 7z распаковывает архивы дорожек по ссылке на облако (src/oblako.py): zip бот открывает
      # сам, а 7z и rar — только им. rar — отдельный пакет из multiverse; не встал — rar-архиву
      # честный отказ, остальное работает.
      - name: Поставить 7z
        continue-on-error: true
        run: |
          install="sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives=$HOME/debs"
          $install --no-download 7zip 7zip-rar || {
            sudo apt-get update -qq
            $install 7zip 7zip-rar || $install 7zip
          }
          (command -v 7zz || command -v 7z) && (7zz i 2>/dev/null || 7z i) | grep -c -i rar || true

      # Сразу, а не в конце задачи: смену обрывают, и запас после шести часов мог бы не лечь вовсе.
      - name: Отложить запас пакетов
        if: steps.debs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/debs/*.deb
          key: debs-${{ steps.image.outputs.version }}

      - name: Представиться для коммитов
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"

      # Всё, что относится к конкретным людям — списки слежения, — лежит
      # в отдельном приватном репозитории. Этот открыт, и такому в нём не место.
      # Пока секреты не заведены, слежение просто выключено: остальное работает.
      - name: Забрать приватное хранилище
        env:
          STATE_REPO: ${{ secrets.STATE_REPO }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          if [ -z "$STATE_REPO" ] || [ -z "$STATE_TOKEN" ]; then
            echo "Приватное хранилище не настроено — слежение выключено."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${STATE_TOKEN}@github.com/${STATE_REPO}.git" private-state
          cd private-state
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          echo "STATE_DIR=${GITHUB_WORKSPACE}/private-state" >> "$GITHUB_ENV"

      - name: Дежурить
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          # Аккаунт владельца: тяжёлый сниппет превью не отдаёт, а бот чужой
          # канал не читает — ролик под пост качается входом в аккаунт.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          # Служебный вход самого бота (MTProto): дорожки СВЕДЕНИЯ больше 20 МБ
          # Bot API не отдаёт, а WAV больше 50 МБ не принимает (src/telegram.py).
          TELEGRAM_BOT_SESSION: ${{ secrets.TELEGRAM_BOT_SESSION }}
          # Подпись ссылок на звук мини-приложения СВЕДЕНИЯ (cloud/skleyka_app.py):
          # тот же ключ лежит в окружении функции. Нет его — кнопки «🎚» нет.
          SKLEYKA_APP_KEY: ${{ secrets.SKLEYKA_APP_KEY }}
          # Реквизиты для перевода за ручное сведение (src/skleyka.py, _sale): клиент видит их
          # по кнопке «Нравится — как оплатить?». Нет секрета — их пришлёт звукорежиссёр сам.
          SKLEYKA_HAND_PAY: ${{ secrets.SKLEYKA_HAND_PAY }}
          # Смена выпускает посты: о свежих релизах — раз в час, мимо слотов,
          # обычные — по часам config.PUBLISH_HOURS_MSK (src/moderate.py,
          # publish_shift). Куда: та же переменная, что у ручного publish.yml.
          PUBLISH_TARGET: ${{ vars.PUBLISH_TARGET || 'admin' }}
          # Кнопка «В канал» публикует и во ВКонтакте тоже
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_PLAYLIST: ${{ vars.VK_PLAYLIST }}
          # Без него разборы ограничены курируемой базой: Last.fm — источник
          # фактов по всем остальным артистам и жанрам.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          # ДВОЙНИК считает по Яндекс Музыке, а с адресов GitHub она отвечает 451:
          # запросы идут через свою функцию в Яндекс Облаке. Без секретов бот
          # ходил бы напрямую и молчал бы на каждой ссылке.
          YANDEX_FUNCTION_URL: ${{ secrets.YANDEX_FUNCTION_URL }}
          YANDEX_FUNCTION_KEY: ${{ secrets.YANDEX_FUNCTION_KEY }}
          # Разборы ПРОЯВКИ генерируются здесь же — генератор тот же,
          # что у постов канала, иначе бот и канал звучат по-разному.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_FALLBACK: ${{ vars.LLM_FALLBACK || 'gigachat' }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-Pro' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Ключ запуска сборки ролика — встроенный, отдельного секрета не нужно.
          GITHUB_TOKEN: ${{ github.token }}
          # Журнал смены — строкой сразу, а не пачкой в конце: print в файл буферизуется,
          # «Дежурство 350 мин.» смены 08:02 записано в 13:52, а при отмене вывод пропадал.
          # Процессы сведения (--job) наследуют.
          PYTHONUNBUFFERED: "1"
        # 350 минут, а не 360: смена должна закончиться сама и успеть сохранить
        # состояние, а не быть прибитой по таймауту на полуслове.
        run: python -m src.moderate --serve 350

      - name: Сохранить состояние
        if: always()
        run: |
          git add data/ content/
          git diff --cached --quiet || git commit -m "дежурство: состояние бота"
          # Конфликт с чужим коммитом — версия смены, как в src/moderate.py (_push_repo):
          # 29.09.2026 этот шаг упал на нём, и состояние за четыре часа пропало.
          git pull --rebase --autostash origin ${{ github.ref_name }} || {
            git rebase --abort || true
            git pull --rebase -X theirs --autostash origin ${{ github.ref_name }}
          }
          git push

      - name: Сохранить списки слежения
        if: always()
        run: |
          if [ ! -d private-state ]; then exit 0; fi
          cd private-state
          git add -A
          git diff --cached --quiet || git commit -m "слежение: списки обновлены"
          git pull --rebase --autostash origin HEAD || true
          git push
