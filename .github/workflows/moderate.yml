name: Бот

# Единственный опросчик бота: забирает нажатия кнопок под превью постов
# и запросы к сервису разборов. У getUpdates общий offset, поэтому вторым
# workflow это делать нельзя — события будут теряться.
# Постоянного сервера у проекта нет, поэтому события обрабатываются пачками:
# между нажатием и публикацией проходит до пяти минут.
on:
  schedule:
    # Пять минут — минимальный интервал, который допускает GitHub.
    # Чаще проверять нельзя, поэтому часики на кнопке живут до пяти минут.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  moderate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Обработать события
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          # Кнопка «В канал» публикует и во ВКонтакте тоже
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          # Разборы ПРОЯВКИ генерируются здесь же — генератор тот же,
          # что у постов канала, иначе бот и канал звучат по-разному.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gigachat' }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-Pro' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.moderate

      - name: Сохранить состояние
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ content/
          git diff --cached --quiet || git commit -m "модерация: решения по постам применены"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
