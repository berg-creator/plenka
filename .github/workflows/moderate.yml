name: Бот

# Единственный опросчик бота: забирает нажатия кнопок под превью постов
# и запросы к сервису разборов. У getUpdates общий offset, поэтому вторым
# workflow это делать нельзя — события будут теряться.
#
# Режим — дежурство: запуск держит соединение с Telegram открытым почти шесть
# часов, поэтому бот отвечает за секунды. Расписанию тут доверять нельзя:
# сначала стоял крон `*/5` и не соблюдался вовсе, потом часовые смены — и между
# ними GitHub пропускал запуски, оставляя дыры по полтора часа. Лечится не
# частотой крона, а длиной смены. Всё это возможно только потому, что
# репозиторий открытый: минуты Actions для публичных репозиториев не считаются.
on:
  schedule:
    # Крон срабатывает каждый час, но смена длится почти шесть — и это не
    # избыточность, а способ пережить пропуски. GitHub регулярно не выполняет
    # запуски по расписанию: на часовых сменах из-за этого получались дыры
    # по полтора часа, когда бот просто не отвечал.
    #
    # Работает это так: пока смена идёт, каждый следующий крон встаёт в очередь
    # группы, а лишние ожидающие GitHub отбрасывает сам — в очереди всегда
    # не больше одного. Как только смена закончится, ожидающий стартует сразу.
    # Чтобы бот замолчал, GitHub должен пропустить все шесть запусков подряд.
    - cron: "0 * * * *"
  workflow_dispatch:

# Своя группа, не общая state-write: смена занимает почти шесть часов,
# и публикация постов не должна стоять в очереди за ней.
concurrency:
  group: bot-serve
  cancel-in-progress: false

jobs:
  serve:
    runs-on: ubuntu-latest
    # Предел GitHub для одной задачи — шесть часов.
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Представиться для коммитов
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Дежурить
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          # Кнопка «В канал» публикует и во ВКонтакте тоже
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          # Без него разборы ограничены курируемой базой: Last.fm — источник
          # фактов по всем остальным артистам и жанрам.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          # Разборы ПРОЯВКИ генерируются здесь же — генератор тот же,
          # что у постов канала, иначе бот и канал звучат по-разному.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          LLM_FALLBACK: ${{ vars.LLM_FALLBACK || 'gigachat' }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-Pro' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # 350 минут, а не 360: смена должна закончиться сама и успеть сохранить
        # состояние, а не быть прибитой по таймауту на полуслове.
        run: python -m src.moderate --serve 350

      - name: Сохранить состояние
        if: always()
        run: |
          git add data/ content/
          git diff --cached --quiet || git commit -m "дежурство: состояние бота"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
