name: Разбор выдумок

# Автопилот точности (src/review.py, бриф — prompts/review.md). Облачный Claude
# по подписке владельца раз в два часа сверяет новые и вышедшие посты с данными
# и пушит файл правок в ветку claude/review-<ГГГГММДД-ЧЧММ>. В main ему пушить
# нельзя, и ветка для него — почтовый ящик, как у роликов (reels.yml). Здесь
# правки проверяются, применяются к main (вышедший пост — прямо в канале),
# а ветка удаляется.
#
# Владельцу воркфлоу пишет только о поломке, одной строкой (job notify):
# решение владельца — автопилот. Ветка упавшего запуска остаётся для разбора.
on:
  push:
    branches: ["claude/review-*"]
  # Повтор вытесненного запуска на его ветке — зовёт job retry.
  workflow_dispatch:
  schedule:
    - cron: "40 */3 * * *"

# Общая state-write: правка переписывает и удаляет файлы content/queue,
# откуда их забирает публикатор, — одновременные запуски подрались бы при коммите.
# Повтору группа не нужна: он только зовёт запуски, а ожидая в state-write,
# сам вытеснил бы чужой ожидающий.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'review-retry' || 'state-write' }}
  cancel-in-progress: false

jobs:
  # В state-write ждёт один запуск, и следующий вытесняет ожидающий: ветка
  # остаётся, правки не применены. Такие ветки старше часа запускаются снова.
  # Упавшие — нет: там ошибка, и владелец о ней уже знает. Идущие — тоже.
  retry:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Перезапустить вытесненные
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          old=$(date -u -d "1 hour ago" +%Y%m%d-%H%M)
          for branch in $(gh api "repos/$GH_REPO/git/matching-refs/heads/claude/review-" --jq '.[].ref | ltrimstr("refs/heads/")'); do
            [[ "${branch#claude/review-}" < "$old" ]] || continue
            busy=$(gh run list --workflow review.yml --branch "$branch" --json status,conclusion \
              --jq '[.[] | select(.status != "completed" or .conclusion == "failure")] | length')
            [ "$busy" = 0 ] || continue
            echo "Повтор: $branch"
            gh workflow run review.yml --ref "$branch"
          done

  apply:
    if: startsWith(github.ref_name, 'claude/review-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Коммит правок в main и удаление ветки.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # На снимке, по которому рутина писала правки: пост там лежит ровно как
      # она его читала, и неверный путь или цитата — её ошибка, а не гонка.
      - name: Проверить на снимке рутины
        run: |
          git fetch --depth 1 origin "$GITHUB_REF_NAME"
          git worktree add --detach "$RUNNER_TEMP/snapshot" FETCH_HEAD
          cd "$RUNNER_TEMP/snapshot"
          python -m src.review --check "content/review/${GITHUB_REF_NAME#claude/review-}.json"

      # К свежему main: между проходом рутины и этим запуском посты выходили
      # и менялись. Поменявшееся --apply пропустит, вышедшее поправит в канале.
      - name: Применить к main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m src.review --apply "$RUNNER_TEMP/snapshot/content/review/${GITHUB_REF_NAME#claude/review-}.json"

      # И после отказа канала: годные правки рядом уже в канале, архив должен
      # помнить их текст, а упавший запуск сам не повторяется.
      - name: Сохранить состояние
        if: ${{ !cancelled() }}
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A content/queue content/archive
          git diff --cached --quiet || git commit -m "разбор: выдумки исправлены"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Удалить ветку
        run: git push origin --delete "$GITHUB_REF_NAME"

  # Поломка не молчит: сторож (src/health.py) красных запусков не видит.
  # curl, а не python: упасть мог и pip.
  notify:
    needs: [retry, apply]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Написать владельцу
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          curl -sS -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
          --data-urlencode "chat_id=$TELEGRAM_ADMIN_ID"
          --data-urlencode "text=⚠️ Автопилот точности сломался, правки не применились: $RUN"
