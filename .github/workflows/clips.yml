name: Клипы

# Вертикальные ролики для VK Клипов и Shorts — единственный бесплатный
# источник холодного охвата.
on:
  # Расписание выключено до конвейера с голосом владельца: синтеза в роликах
  # не будет, а без голоса сервер собирал бы немые ролики. Подложек на сервере
  # пока тоже нет — ручной запуск упадёт на pick_audio.
  workflow_dispatch:
    inputs:
      count:
        description: "Сколько клипов собрать"
        type: string
        default: "1"
      preview:
        description: "Только собрать, не выкладывать"
        type: boolean
        default: false
      facts:
        description: "Формат А ВЫ ЗНАЛИ вместо разбора связи"
        type: boolean
        default: false
      news:
        description: "Новостной формат из свежего inbox"
        type: boolean
        default: false

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ffmpeg собирает ролик, fonts-liberation рисует на кадрах кириллицу.
      - name: Поставить ffmpeg и шрифт
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation

      - name: Собрать клипы
        env:
          # Готовый ролик приходит владельцу в личку: заливать видео
          # групповым ключом ВКонтакте не даёт, перекладывается руками.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          # Без ключа стока сборка не падает — рисует фон сама.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Закадровый голос. Без ключа ролик собирается молча:
          # голос — украшение, а не условие выпуска.
          FISH_AUDIO_KEY: ${{ secrets.FISH_AUDIO_KEY }}
          # Строки новостного ролика пишет модель — тем же генератором,
          # что и посты канала.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          LLM_FALLBACK: ${{ vars.LLM_FALLBACK || 'gigachat' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-Pro' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          FORMAT=""
          if [ "${{ inputs.facts }}" = "true" ]; then FORMAT="--facts"; fi
          if [ "${{ inputs.news }}" = "true" ]; then FORMAT="--news"; fi
          python -m src.clips \
            --build "${{ inputs.count || '1' }}" \
            $FORMAT \
            ${{ inputs.preview && '--preview' || '--publish' }}

      # Артефакт — запасной путь к файлу, если Telegram не доставил
      # или ролик хочется забрать на компьютер, а не с телефона.
      - name: Сохранить ролики
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: assets/clips/*.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: Сохранить состояние
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "клипы: собран ролик"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
