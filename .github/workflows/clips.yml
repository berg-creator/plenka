name: Клипы

# Вертикальные ролики для VK Клипов и Shorts — единственный бесплатный
# источник холодного охвата. Три раза в неделю: чаще расходует базу связей
# быстрее, чем она пополняется руками.
on:
  schedule:
    - cron: "0 8 * * 1,3,5"
  workflow_dispatch:
    inputs:
      count:
        description: "Сколько клипов собрать"
        type: string
        default: "1"
      preview:
        description: "Только собрать, не выкладывать"
        type: boolean
        default: false
      facts:
        description: "Формат А ВЫ ЗНАЛИ вместо разбора связи"
        type: boolean
        default: false

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ffmpeg собирает ролик, fonts-liberation рисует на кадрах кириллицу.
      - name: Поставить ffmpeg и шрифт
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation

      - name: Собрать клипы
        env:
          # Готовый ролик приходит владельцу в личку: заливать видео
          # групповым ключом ВКонтакте не даёт, перекладывается руками.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          # Без ключа стока сборка не падает — рисует фон сама.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Закадровый голос. Без ключа ролик собирается молча:
          # голос — украшение, а не условие выпуска.
          FISH_AUDIO_KEY: ${{ secrets.FISH_AUDIO_KEY }}
        run: |
          python -m src.clips \
            --build "${{ inputs.count || '1' }}" \
            ${{ inputs.facts && '--facts' || '' }} \
            ${{ inputs.preview && '--preview' || '--publish' }}

      # Артефакт — запасной путь к файлу, если Telegram не доставил
      # или ролик хочется забрать на компьютер, а не с телефона.
      - name: Сохранить ролики
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: assets/clips/*.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: Сохранить состояние
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "клипы: собран ролик"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
