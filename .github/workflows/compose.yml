name: Генерация постов

# Два шага в одном воркфлоу: сначала забираем готовый батч (если он был отправлен
# в прошлый раз), потом отправляем новый. Batch API вдвое дешевле обычных запросов,
# но готовится не мгновенно — поэтому отправка и получение разнесены по запускам.
on:
  schedule:
    - cron: "40 3 * * *"    # раз в сутки ночью — отправка новой пачки
    - cron: "40 7 * * *"    # и через четыре часа — забрать результат
  workflow_dispatch:

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Забрать готовый батч
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gigachat' }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-Pro' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.compose --fetch

      - name: Отправить новую пачку
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gigachat' }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-Pro' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.compose --submit

      - name: Сохранить состояние
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ content/
          git diff --cached --quiet || git commit -m "генерация: обновлена очередь постов"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
