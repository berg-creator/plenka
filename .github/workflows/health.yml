name: Сторож

# Следит, чтобы канал не встал молча: пустая очередь, зависшая публикация,
# прекратившийся поток новинок. О проблемах пишет в личку.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Очередь сведения лежит в приватном хранилище (config.SKLEYKA_FILE): без него сторож
      # не видит, что она стоит. Только чтение — сторож туда ничего не пишет.
      - name: Забрать приватное хранилище
        env:
          STATE_REPO: ${{ secrets.STATE_REPO }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          if [ -z "$STATE_REPO" ] || [ -z "$STATE_TOKEN" ]; then
            echo "Приватное хранилище не настроено — очередь сведения сторож не видит."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${STATE_TOKEN}@github.com/${STATE_REPO}.git" private-state
          echo "STATE_DIR=${GITHUB_WORKSPACE}/private-state" >> "$GITHUB_ENV"

      - name: Проверить состояние
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          # Сторож проверяет, что Яндекс Музыка ещё отвечает без входа, — тем же
          # путём, каким её спрашивает бот (src/svedenie.py).
          YANDEX_FUNCTION_URL: ${{ secrets.YANDEX_FUNCTION_URL }}
          YANDEX_FUNCTION_KEY: ${{ secrets.YANDEX_FUNCTION_KEY }}
          # Список красных запусков: чтения, которое даёт встроенный ключ, хватает.
          GITHUB_TOKEN: ${{ github.token }}
        # --quiet: писать только если что-то сломалось, а не каждый день
        run: python -m src.health --quiet

      # Просьбы о месте голоса в СВЕДЕНИИ разбирает генератор, а из России Gemini не отвечает —
      # поэтому здесь: промах генератора красит запуск, и сторож назавтра пишет о нём строку.
      - name: Проверить, как генератор понимает просьбы к сведению
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_FALLBACK: ${{ vars.LLM_FALLBACK || 'gigachat' }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-Pro' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python -m src.skleyka --talk-check

      # Дорожки ссылкой на облако (src/oblako.py) качает дежурство с адресов GitHub, и отвечают ли
      # ему облака, видно только отсюда. Адреса заведомо пустые: ни чужих ссылок, ни имён в журнале.
      - name: Проверить, отвечают ли облака
        run: python -m src.oblako --probe
