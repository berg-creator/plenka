name: Публикация

# Ручной выход. Посты выпускает дежурство (src/moderate.py, publish_shift) раз
# в 10 минут по часам config.PUBLISH_HOURS_MSK. Крона здесь больше нет: 13.09.2026
# GitHub создавал из четырёх запусков по расписанию один-два и с опозданием
# на 3–5 часов, а второй публикатор на той же очереди выпустил бы пост дважды.
# Ежечасный выход релиза отсюда убран ещё раньше: он занимал общую группу
# state-write и вытеснял из очереди сбор новинок и срочные новости.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Куда публиковать"
        type: choice
        options: [admin, channel]
        default: admin
      force:
        description: "Игнорировать интервал между постами"
        type: boolean
        default: false

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Опубликовать следующий пост
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          # ВКонтакте: кросспостинг включается сам при наличии токена
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_PLAYLIST: ${{ vars.VK_PLAYLIST }}
          # Переменная PUBLISH_TARGET задаётся в Settings → Variables.
          # Пока стоит admin — посты уходят в личку. Меняешь на channel, когда готов.
          TARGET: ${{ inputs.target || vars.PUBLISH_TARGET || 'admin' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m src.publish --target "$TARGET" $FORCE

      - name: Сохранить состояние
        run: |
          git config user.name "plenka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ content/
          git diff --cached --quiet || git commit -m "публикация: пост отправлен"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
